repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest (with coverage)
        entry: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=100 -q
        language: system
        pass_filenames: false
        stages: [pre-push]
